<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 마인크래프트 멀티플레이</title>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            margin-bottom: 10px;
            font-size: 18px;
            text-align: center;
        }
        canvas {
            border: 4px solid #444;
            background: #87CEEB;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>2D Minecraft Multiplayer</h2>
        <span>이동: WASD / 방향키 | 블록 설치: 우클릭 | 블록 파괴: 좌클릭 | 블록 선택: 1~5번</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 32;
        let players = {};
        let world = {};
        let myId = null;

        const player = {
            x: 100,
            y: 100,
            width: 24,
            height: 28,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpPower: 10,
            selectedBlock: 1
        };

        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)) {
                player.selectedBlock = parseInt(e.code.replace('Digit',''));
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // 블록 타입별 색상
        const blockColors = {
            1: '#8B4513', // 흙 (Dirt)
            2: '#787878', // 돌 (Stone)
            3: '#228B22', // 잔디 (Grass)
            4: '#A0522D', // 나무 (Wood)
            5: '#FFD700'  // 황금 (Gold)
        };

        socket.on('init', (data) => {
            myId = data.id;
            world = data.world;
            players = data.players;
            if (players[myId]) {
                player.x = players[myId].x;
                player.y = players[myId].y;
            }
        });

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
        });

        socket.on('playerMoved', (pData) => {
            if (players[pData.id]) {
                players[pData.id].x = pData.x;
                players[pData.id].y = pData.y;
            }
        });

        socket.on('worldUpdate', (serverWorld) => {
            world = serverWorld;
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // 카메라 보정 계산 (플레이어 중심)
            const camX = player.x - canvas.width / 2;
            const camY = player.y - canvas.height / 2;

            const worldX = Math.floor((clickX + camX) / TILE_SIZE);
            const worldY = Math.floor((clickY + camY) / TILE_SIZE);
            const key = `${worldX},${worldY}`;

            if (e.button === 0) {
                // 좌클릭: 블록 파괴
                if (world[key]) {
                    delete world[key];
                    socket.emit('breakBlock', { x: worldX, y: worldY });
                }
            } else if (e.button === 2) {
                // 우클릭: 블록 설치
                if (!world[key]) {
                    world[key] = player.selectedBlock;
                    socket.emit('placeBlock', { x: worldX, y: worldY, type: player.selectedBlock });
                }
            }
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        function update() {
            // 이동 로직
            if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
            else if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;
            else player.vx = 0;

            // 간단한 중력 및 점프
            player.vy += 0.5; // 중력
            if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space'])) {
                // 바닥에 닿았을 때 점프 (간이 체크)
                player.vy = -player.jumpPower;
            }

            player.x += player.vx;
            player.y += player.vy;

            // 바닥 제한
            if (player.y > 1000) {
                player.y = 100;
                player.vy = 0;
            }

            if (myId && players[myId]) {
                socket.emit('playerMovement', { x: player.x, y: player.y });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const camX = player.x - canvas.width / 2;
            const camY = player.y - canvas.height / 2;

            ctx.save();
            ctx.translate(-camX, -camY);

            // 월드 렌더링
            for (let key in world) {
                let [wx, wy] = key.split(',').map(Number);
                ctx.fillStyle = blockColors[world[key]] || '#fff';
                ctx.fillRect(wx * TILE_SIZE, wy * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.strokeRect(wx * TILE_SIZE, wy * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }

            // 플레이어들 렌더링
            for (let id in players) {
                let p = players[id];
                ctx.fillStyle = (id === myId) ? '#ff5555' : '#5555ff';
                ctx.fillRect(p.x, p.y, player.width, player.height);
                
                // 닉네임 표시
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Courier New';
                ctx.fillText(id.substring(0, 5), p.x, p.y - 6);
            }

            ctx.restore();

            // 인벤토리 UI 표시
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(10, 10, 200, 40);
            ctx.fillStyle = '#fff';
            ctx.font = '14px Courier New';
            ctx.fillText(`선택 블록: [${player.selectedBlock}] (1~5변경)`, 20, 35);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
